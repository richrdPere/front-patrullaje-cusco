<!-- Botón inicial: el panel permanece cerrado por defecto -->
@if (!panelAbierto) {
<button type="button" class="btn btn-primary btn-square absolute right-3 top-3 z-30
           shadow-lg shadow-primary/20
           sm:right-4 sm:top-4 sm:w-auto sm:px-4" (click)="abrirPanel()" aria-label="Mostrar zonas de patrullaje"
  title="Mostrar zonas de patrullaje">

  <i class="fa-solid fa-map-location-dot text-base" aria-hidden="true">
  </i>

  <span class="hidden sm:inline">
    Zonas
  </span>
</button>
}

<!-- Panel visible solo bajo demanda -->
@if (panelAbierto) {
<section class="absolute bottom-3 left-3 right-3 z-30
           max-h-[55dvh] overflow-hidden rounded-2xl
           border border-base-300/80 bg-base-100/95
           shadow-2xl backdrop-blur-md
           sm:bottom-auto sm:left-auto sm:right-4
           sm:top-4 sm:w-80" aria-labelledby="zonas-panel-title">

  <!-- Indicador visual en móvil -->
  <div class="flex justify-center pb-1 pt-2 sm:hidden" aria-hidden="true">
    <span class="h-1 w-10 rounded-full bg-base-content/15">
    </span>
  </div>

  <!-- Cabecera -->
  <header class="flex items-center justify-between gap-3
             border-b border-base-300 px-4 py-3">

    <div class="min-w-0">
      <h2 id="zonas-panel-title" class="truncate text-sm font-semibold
                 text-base-content sm:text-base">
        Zonas de patrullaje
      </h2>

      <p class="mt-0.5 text-xs text-base-content/55">
        Seleccione las zonas que desea visualizar.
      </p>
    </div>

    <button type="button" class="btn btn-circle btn-ghost btn-sm shrink-0" (click)="cerrarPanel()"
      aria-label="Cerrar panel de zonas" title="Cerrar">

      <i class="fa-solid fa-xmark text-base" aria-hidden="true">
      </i>
    </button>
  </header>

  <!-- Listado -->
  <div class="max-h-[calc(55dvh-5.5rem)]
             overflow-y-auto overscroll-contain p-3
             sm:max-h-[50dvh]">

    @if (zonas.length) {
    <ul class="space-y-1">
      @for (zona of zonas; track zona.value) {
      <li>
        <label class="flex min-h-11 cursor-pointer items-center
                       gap-3 rounded-xl px-3 py-2
                       transition-colors hover:bg-base-200">

          <input type="checkbox" class="checkbox checkbox-primary checkbox-sm shrink-0" [checked]="estaVisible(zona)"
            (change)="alternarZona(zona)" />

          <span class="min-w-0 flex-1 truncate text-sm
                         text-base-content/80">
            {{ zona.nombre }}
          </span>

          <span class="size-2.5 shrink-0 rounded-full" [class.bg-success]="estaVisible(zona)"
            [class.bg-base-300]="!estaVisible(zona)" aria-hidden="true">
          </span>
        </label>
      </li>
      }
    </ul>
    } @else {
    <div class="px-4 py-8 text-center" role="status">
      <i class="fa-solid fa-map-location-dot
                   text-3xl text-base-content/25" aria-hidden="true">
      </i>

      <p class="mt-3 text-sm font-medium text-base-content/70">
        No hay zonas disponibles
      </p>
    </div>
    }
  </div>
</section>
}
