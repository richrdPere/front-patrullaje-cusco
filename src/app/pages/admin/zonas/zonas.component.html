<div class="p-6 min-h-full bg-base-300 text-base-content overflow-auto transition-colors duration-300">


  <!-- Titulo -->
  <h1 class="text-2xl font-bold mb-5 text-base-content ">Gestión de Zonas</h1>

  <div class="p-4 mb-7 card bg-base-100 shadow-md">
    <form [formGroup]="zonaForm">

      <div class="flex flex-col lg:flex-row gap-6">

        <!-- Formulario: lado izquierdo -->
        <div class="lg:w-1/3 w-full space-y-6">
          <!-- Form - Zonas -->
          <div class="card bg-base-300 rounded-box p-6 space-y-4 shadow-md">
            <!-- Nombre -->
            <input type="text" placeholder="Nombre" formControlName="nombre" class="input input-bordered w-full "
              appUppercase />
            <!-- Descripción -->
            <textarea placeholder="Descripción" formControlName="descripcion" class="textarea textarea-bordered w-full "
              rows="4"></textarea>

            <!-- Riesgo -->
            <select formControlName="riesgo" class="select select-bordered w-full ">
              <option [ngValue]="null">Seleccionar nivel de riesgo</option>
              <option *ngFor="let g of nivel_riesgo" [value]="g.id">
                {{ g.nombre }}
              </option>
            </select>

            <!-- Botón -->
            <button class="btn btn-primary w-full mt-2" type="button" (click)="guardarZona()">
              Guardar Zona
            </button>
          </div>

          <!-- Tabla - Zonas -->
          <div class="card bg-base-300 rounded-xl p-6 space-y-4 shadow-md ">
            <div class="overflow-x-auto">

              @if (zonas.length != 0) {
              <table class="table table-zebra">
                <!-- head -->
                <thead>
                  <tr>
                    <th>Check</th>
                    <th>Zona</th>
                    <th>Riesgo</th>
                    <th>Opciones</th>
                  </tr>
                </thead>
                <tbody>

                  <!-- row 1 -->
                  @for (zona of zonas; track $index) {
                  <tr>
                    <td>
                      <label>
                        <input type="checkbox" [checked]="zonasVisibles[zona.id]" (change)="toggleZona(zona)"
                          class="checkbox checkbox-sm" />
                      </label>
                    </td>

                    <td>{{ zona.nombre }}</td>

                    <td>{{ zona.riesgo }}</td>

                    <td class="flex justify-center items-center">
                      <button class="btn btn-xs btn-error" (click)="eliminarZona(zona.id)"> <img
                          src="assets/icons/crud/delete.svg" alt="Icon Eliminar" class="w-5 h-5 "></button>

                    </td>
                  </tr>
                  }
                </tbody>

              </table>
              }
              @else {
              <p>No hay Zonas Registradas</p>
              }


            </div>
          </div>
        </div>

        <!-- Mapa: lado derecho -->
        <div class="lg:w-2/3 w-full">
          <div class="card bg-base-300 rounded-xl p-4 shadow-md h-full">

            <!-- Barra de herramientas -->
            <div class="flex justify-between items-center mb-3 flex-wrap gap-3">

              <!-- Botones -->
              <div class="flex flex-wrap gap-2">

                <button type="button" class="btn btn-primary btn-sm inline-flex items-center gap-2" (click)="initDraw()"
                  [disabled]="drawing">

                  <i class="fa-solid fa-map"></i>
                  <span>Iniciar dibujo</span>

                </button>

                <button type="button" class="btn btn-success btn-sm inline-flex items-center gap-2"
                  (click)="finishedDraw()" [disabled]="!drawing">

                  <i class="fa-solid fa-check"></i>
                  <span>Finalizar</span>

                </button>

                <button type="button" class="btn btn-error btn-sm inline-flex items-center gap-2" (click)="cancelDraw()"
                  [disabled]="!drawing">

                  <i class="fa-solid fa-xmark"></i>
                  <span>Cancelar</span>

                </button>

              </div>

              <!-- Badge -->
              <div class="badge badge-info badge-lg whitespace-nowrap">

                Vértices: {{ coordenadas.length }}

              </div>

            </div>
            <div #mapContainer id="map" class="w-full flex-1  rounded border">
            </div>
          </div>


        </div>
      </div>

    </form>
  </div>

</div>
