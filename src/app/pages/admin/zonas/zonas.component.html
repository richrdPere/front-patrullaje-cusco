<div
  class="min-h-full min-w-0 bg-base-300 px-4 py-5 text-base-content transition-colors duration-300 sm:px-6 sm:py-6 lg:px-8">

  <!-- CONTENEDOR DEL DASHBOARD -->
  <div class="mx-auto w-full max-w-500">


    <!-- Titulo -->
    <!-- <h1 class="text-2xl font-bold mb-5 text-base-content ">Gestión de Zonas</h1> -->

    <!-- ================================================= -->
    <!-- ENCABEZADO -->
    <!-- ================================================= -->
    <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

      <!-- ÍCONO + INFORMACIÓN -->
      <div class="flex min-w-0 items-center gap-3">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-primary/10 text-primary sm:h-12 sm:w-12">
          <i class="fa-solid fa-location-dot text-xl sm:text-2xl"></i>
        </div>

        <div class="min-w-0">
          <h1 class="truncate text-xl font-bold leading-tight text-base-content sm:text-2xl">
            Gestión de Zonas
          </h1>

          <p class="mt-1 text-sm leading-relaxed
                   text-base-content/60">

            Dibuje las zonas respectivas para el personal de Serenazgo.
          </p>
        </div>
      </div>
    </header>

    <!-- ================================================= -->
    <!-- FORMULARIO -->
    <!-- ================================================= -->
    <div class="p-4 mb-7 card bg-base-100 shadow-md">
      <form [formGroup]="zonaForm">

        <div class="flex flex-col lg:flex-row gap-6">

          <!-- Formulario: lado izquierdo -->
          <div class="lg:w-1/3 w-full space-y-6">
            <!-- Form - Zonas -->
            <div class="card bg-base-300 rounded-box p-6 space-y-4 shadow-md">
              <!-- Nombre -->
              <input type="text" placeholder="Nombre" formControlName="nombre" class="input input-bordered w-full "
                appUppercase />
              <!-- Descripción -->
              <textarea placeholder="Descripción" formControlName="descripcion"
                class="textarea textarea-bordered w-full " rows="4"></textarea>

              <!-- Riesgo -->
              <select formControlName="riesgo" class="select select-bordered w-full ">
                <option [ngValue]="null">Seleccionar nivel de riesgo</option>
                <option *ngFor="let g of nivel_riesgo" [value]="g.id">
                  {{ g.nombre }}
                </option>
              </select>

              <!-- Botón -->
              <button class="btn btn-primary w-full mt-2" type="button" (click)="guardarZona()">
                Guardar Zona
              </button>
            </div>

            <!-- Tabla - Zonas -->
            <div class="card bg-base-300 rounded-xl p-6 space-y-4 shadow-md ">
              <div class="overflow-x-auto">

                @if (zonas.length != 0) {
                <table class="table table-zebra">
                  <!-- head -->
                  <thead>
                    <tr>
                      <th>Check</th>
                      <th>Zona</th>
                      <th>Riesgo</th>
                      <th>Opciones</th>
                    </tr>
                  </thead>
                  <tbody>

                    <!-- row 1 -->
                    @for (zona of zonas; track $index) {
                    <tr>
                      <td>
                        <label>
                          <input type="checkbox" [checked]="zonasVisibles[zona.id]" (change)="toggleZona(zona)"
                            class="checkbox checkbox-sm" />
                        </label>
                      </td>

                      <td>{{ zona.nombre }}</td>

                      <td>{{ zona.riesgo }}</td>

                      <td class="flex justify-center items-center">
                        <button class="btn btn-xs btn-error" (click)="eliminarZona(zona.id)"> <img
                            src="assets/icons/crud/delete.svg" alt="Icon Eliminar" class="w-5 h-5 "></button>

                      </td>
                    </tr>
                    }
                  </tbody>

                </table>
                }
                @else {
                <p>No hay Zonas Registradas</p>
                }


              </div>
            </div>
          </div>

          <!-- Mapa: lado derecho -->
          <div class="lg:w-2/3 w-full">
            <div class="card bg-base-300 rounded-xl p-4 shadow-md h-full">

              <!-- Barra de herramientas -->
              <div class="flex justify-between items-center mb-3 flex-wrap gap-3">

                <!-- Botones -->
                <div class="flex flex-wrap gap-2">

                  <button type="button" class="btn btn-primary btn-sm inline-flex items-center gap-2"
                    (click)="initDraw()" [disabled]="drawing">

                    <i class="fa-solid fa-map"></i>
                    <span>Iniciar dibujo</span>

                  </button>

                  <button type="button" class="btn btn-success btn-sm inline-flex items-center gap-2"
                    (click)="finishedDraw()" [disabled]="!drawing">

                    <i class="fa-solid fa-check"></i>
                    <span>Finalizar</span>

                  </button>

                  <button type="button" class="btn btn-error btn-sm inline-flex items-center gap-2"
                    (click)="cancelDraw()" [disabled]="!drawing">

                    <i class="fa-solid fa-xmark"></i>
                    <span>Cancelar</span>

                  </button>

                </div>

                <!-- Badge -->
                <div class="badge badge-info badge-lg whitespace-nowrap">

                  Vértices: {{ coordenadas.length }}

                </div>

              </div>
              <div #mapContainer id="map" class="w-full flex-1  rounded border">
              </div>
            </div>


          </div>
        </div>

      </form>
    </div>

  </div>

</div>
